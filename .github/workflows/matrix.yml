name: Classification matrix

# The matrix verifies every patch of every fixture and takes up to two hours, so it runs only
# when started by hand, never on a push or a pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: make matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the runner image
        run: make image

      - name: Classification matrix
        run: make matrix

      # The page is rendered also when a patch does not match, so it is uploaded in that case too.
      - name: Upload the matrix page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: classification-matrix
          path: docs/classification-matrix.md
          if-no-files-found: error
