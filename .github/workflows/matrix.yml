name: Classification matrix

# The matrix verifies every patch of every fixture and takes up to two hours, so it runs only
# when started by hand, never on a push or a pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: make matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the runner image
        run: make image

      - name: Classification matrix
        run: make matrix

      # The page is rendered also when a patch does not match, so it is uploaded in that case too.
      - name: Upload the matrix page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classification-matrix
          path: docs/classification-matrix.md
          if-no-files-found: error
